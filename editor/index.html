<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vanilla Press Editor</title>
<link rel="icon" href="/brand/favicon.ico" sizes="any"/>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/brand/png/apple-touch-icon.png"/>
<link rel="manifest" href="/brand/site.webmanifest"/>
<meta name="theme-color" content="#23314F"/>
<link rel="stylesheet" href="/assets/vb/vanilla-breeze.css"/>
<link rel="stylesheet" href="/brand/tokens.css"/>
<link rel="stylesheet" href="/app/assets/brand-ui.css"/>
<link rel="stylesheet" href="assets/css/editor.css"/>

<script type="importmap">
{
  "imports": {
    "prosemirror-model": "https://esm.sh/*prosemirror-model@1.25.1",
    "prosemirror-state": "https://esm.sh/*prosemirror-state@1.4.3",
    "prosemirror-view": "https://esm.sh/*prosemirror-view@1.38.1",
    "prosemirror-transform": "https://esm.sh/*prosemirror-transform@1.10.4",
    "prosemirror-keymap": "https://esm.sh/*prosemirror-keymap@1.2.2",
    "prosemirror-commands": "https://esm.sh/*prosemirror-commands@1.6.2",
    "prosemirror-history": "https://esm.sh/*prosemirror-history@1.4.1",
    "prosemirror-inputrules": "https://esm.sh/*prosemirror-inputrules@1.4.0",
    "prosemirror-schema-list": "https://esm.sh/*prosemirror-schema-list@1.5.1",
    "prosemirror-dropcursor": "https://esm.sh/*prosemirror-dropcursor@1.8.1",
    "prosemirror-gapcursor": "https://esm.sh/*prosemirror-gapcursor@1.3.2",
    "prosemirror-tables": "https://esm.sh/*prosemirror-tables@1.6.2",
    "rope-sequence": "https://esm.sh/*rope-sequence@1.3.4",
    "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8",
    "orderedmap": "https://esm.sh/*orderedmap@2.1.1",
    "crelt": "https://esm.sh/*crelt@1.0.6"
  }
}
</script>
</head>
<body>
<editor-shell>
  <!-- Top bar: shown and wired by site-mode.js (the app, ?site=, and vp serve; "← Posts" and the site name are the app's only) -->
  <header class="site-header" data-site-header hidden>
    <a class="back-to-posts" data-back-to-posts href="/app/">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"></path></svg>
      Posts
    </a>
    <span class="header-rule" data-site-name-rule aria-hidden="true"></span>
    <p class="site-name" data-site-name></p>
    <p class="save-pill" data-save-state role="status" aria-live="polite"></p>
    <p class="page-theme-chip" data-page-theme-chip hidden><span class="page-theme-dot" data-page-theme-dot aria-hidden="true"></span><span data-page-theme-name></span></p>
    <div class="spacer"></div>
    <div class="header-actions">
      <button type="button" class="quiet" data-site-preview>Preview</button>
      <button type="button" class="icon-btn" data-settings-toggle aria-label="Post settings" aria-pressed="true" aria-controls="settings-panel">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
      </button>
      <more-menu data-more-menu></more-menu>
      <p class="action-state" data-action-state role="status" aria-live="polite"></p>
      <button type="button" class="primary" data-site-primary>Publish</button>
    </div>
    <div class="action-report" data-action-report hidden role="alert">
      <div data-action-report-body></div>
      <button type="button" data-action-report-close>Dismiss</button>
    </div>
  </header>

  <main class="editor-pane" data-theme="">
    <!-- Site mode, a post with its own theme: the site's header, in the theme it gets on the live page -->
    <div class="site-strip" data-site-strip hidden>
      <span class="site-strip-name" data-site-strip-name></span>
      <span class="site-strip-note" data-site-strip-note></span>
    </div>
    <div class="editor-content" data-vb-no-track>
      <!-- ProseMirror mounts here. data-vb-no-track: VB analytics would tag outbound links and ProseMirror would redraw them forever -->
    </div>
  </main>

  <!-- Post settings (toggled from the top bar). "Show block tree" swaps its
       contents for the block tree until "Back to settings". -->
  <aside class="editor-sidebar settings-panel" id="settings-panel" data-settings-panel aria-labelledby="settings-title">
    <div class="settings-main" data-settings-main>
      <h2 id="settings-title" class="settings-title" tabindex="-1">Post settings</h2>
      <component-settings></component-settings>
      <meta-panel></meta-panel>
      <!-- vp serve only: which content, the document list and the theme -->
      <div class="fixture-tools" data-fixture-tools>
        <p class="site-label" data-site-label></p>
        <doc-browser></doc-browser>
        <theme-picker></theme-picker>
      </div>
    </div>
    <ast-inspector hidden></ast-inspector>
  </aside>
  <confirm-panel data-confirm></confirm-panel>
</editor-shell>

<script type="module" src="assets/js/editor.js"></script>
<!-- Vanilla Breeze's own elements (the bundled components) are live in the
     editor. After editor.js: VB also ships a <theme-picker>, and its registry
     skips a tag that is already defined, so the editor's own picker wins. -->
<script type="module" src="/assets/vb/vanilla-breeze.js"></script>
</body>
</html>
