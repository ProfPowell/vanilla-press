<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Site - Vanilla Press</title>
<link rel="stylesheet" href="/assets/vb/vanilla-breeze.css"/>
<link rel="stylesheet" href="/app/assets/app.css"/>
<script src="/assets/vb/vanilla-breeze.js" defer></script>
<script type="module" src="/app/assets/js/site-page.js"></script>
</head>
<body>
<div class="app-page wide">
  <header class="page-head">
    <div>
      <a href="/" class="back">&larr; Sites</a>
      <h1 id="site-name">Site</h1>
    </div>
    <div class="actions">
      <a id="view-site" href="#" target="_blank" rel="noopener" hidden>View site</a>
      <button type="button" id="preview-btn" disabled title="Open a post to preview it">Preview</button>
    </div>
  </header>

  <div class="site-layout">
    <nav aria-label="Site sections" class="side-nav">
      <ul>
        <li><button type="button" data-section="posts" aria-current="page">Posts</button></li>
        <li><button type="button" data-section="media">Media</button></li>
        <li><button type="button" data-section="theme">Theme</button></li>
        <li><button type="button" data-section="programs">Programs</button></li>
        <li><button type="button" data-section="analytics">Analytics</button></li>
        <li><button type="button" data-section="social">Social</button></li>
      </ul>
    </nav>

    <main>
      <section id="posts-section" aria-labelledby="posts-title">
        <div class="section-head">
          <h2 id="posts-title">Posts</h2>
          <button type="button" id="new-post">New post</button>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
        <p id="empty" hidden>No posts yet. Start with a new post.</p>
        <ul id="posts" class="post-list" aria-labelledby="posts-title"></ul>
      </section>
      <section id="soon-section" aria-labelledby="soon-title" hidden>
        <h2 id="soon-title"></h2>
        <p>Coming soon</p>
      </section>
      <p id="backup-status" class="muted" role="status"></p>
    </main>
  </div>
</div>
</body>
</html>
