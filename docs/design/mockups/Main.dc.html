<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vanilla Press — Sites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#121212}a:hover{color:#555555}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #ffffff; color: #121212; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.5">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; border-bottom: 1px solid #f1f1f1">
    <p style="margin: 0; font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif; font-weight: 700; font-size: 18px; letter-spacing: -0.01em">Vanilla Press</p>
    <p style="margin: 0; font-size: 13px; color: #555555">Local · 127.0.0.1:3007</p>
  </header>

  <main style="max-width: 760px; margin: 0 auto; padding: 72px 24px 96px; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 40px">
      <div>
        <h1 style="margin: 0; font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif; font-weight: 700; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em">Sites</h1>
        <p style="margin: 8px 0 0; color: #555555; font-size: 15px">Cook sites this machine edits. Each one is a Git repo.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #dedede; border-radius: 8px; background: #ffffff; color: #121212; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Clone from GitHub</button>
        <button type="button" style="min-height: 44px; padding: 0 18px; border: 1px solid {{accent}}; border-radius: 8px; background: {{accent}}; color: #ffffff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Add site</button>
      </div>
    </div>

    <article style="border: 1px solid #dedede; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: flex-start">
      <div style="flex: 1 1 320px; min-width: 0">
        <h2 style="margin: 0; font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif; font-size: 26px; font-weight: 700; line-height: 1.2"><a href="Site.dc.html" style="text-decoration: none">thomasapowell.com</a></h2>
        <p style="margin: 6px 0 0; font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace; font-size: 13px; color: #555555; overflow-wrap: anywhere">~/src/thomasapowell.com</p>
        <div style="display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; font-size: 14px; color: #555555">
          <span><strong style="color: #121212; font-weight: 600">2</strong> published</span>
          <span><strong style="color: #121212; font-weight: 600">0</strong> drafts</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #2f8a3e"></span>GitHub · main · in sync</span>
          <span>Backed up 8:48 AM</span>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <a href="https://thomasapowell.com" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; font-size: 15px; color: #555555; text-decoration: none">View live
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
        </a>
        <a href="Site.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #dedede; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none">Open</a>
      </div>
    </article>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2b59c3","options":["#2b59c3","#121212","#1d6b5a","#a3401f"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2b59c3' };
  }
}
</script>
</body>
</html>
