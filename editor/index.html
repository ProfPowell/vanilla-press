<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vanilla Press Editor</title>
<link rel="stylesheet" href="/assets/vb/vanilla-breeze.css"/>
<link rel="stylesheet" href="assets/css/editor.css"/>

<script type="importmap">
{
  "imports": {
    "prosemirror-model": "https://esm.sh/*prosemirror-model@1.25.1",
    "prosemirror-state": "https://esm.sh/*prosemirror-state@1.4.3",
    "prosemirror-view": "https://esm.sh/*prosemirror-view@1.38.1",
    "prosemirror-transform": "https://esm.sh/*prosemirror-transform@1.10.4",
    "prosemirror-keymap": "https://esm.sh/*prosemirror-keymap@1.2.2",
    "prosemirror-commands": "https://esm.sh/*prosemirror-commands@1.6.2",
    "prosemirror-history": "https://esm.sh/*prosemirror-history@1.4.1",
    "prosemirror-inputrules": "https://esm.sh/*prosemirror-inputrules@1.4.0",
    "prosemirror-schema-list": "https://esm.sh/*prosemirror-schema-list@1.5.1",
    "prosemirror-dropcursor": "https://esm.sh/*prosemirror-dropcursor@1.8.1",
    "prosemirror-gapcursor": "https://esm.sh/*prosemirror-gapcursor@1.3.2",
    "prosemirror-tables": "https://esm.sh/*prosemirror-tables@1.6.2",
    "rope-sequence": "https://esm.sh/*rope-sequence@1.3.4",
    "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8",
    "orderedmap": "https://esm.sh/*orderedmap@2.1.1",
    "crelt": "https://esm.sh/*crelt@1.0.6"
  }
}
</script>
</head>
<body>
<editor-shell>
  <!-- The app's header (?site=): shown and wired by site-mode.js; vp serve never shows it -->
  <header class="site-header" data-site-header hidden>
    <a class="back-to-posts" data-back-to-posts href="/app/">&larr; Posts</a>
    <p class="save-state" data-save-state role="status" aria-live="polite"></p>
    <div class="spacer"></div>
    <p class="action-state" data-action-state role="status" aria-live="polite"></p>
    <button type="button" data-tools-toggle aria-expanded="false">Tools</button>
    <button type="button" data-settings-toggle aria-pressed="true">Settings</button>
    <button type="button" data-site-preview>Preview</button>
    <button type="button" class="btn-publish" data-site-publish>Publish</button>
    <button type="button" class="btn-update" data-site-update hidden title="Put your saved edits on the live site">Update</button>
    <div class="action-report" data-action-report hidden role="alert">
      <div data-action-report-body></div>
      <button type="button" data-action-report-close>Dismiss</button>
    </div>
  </header>

  <div class="editor-toolbar">
    <!-- Formatting buttons injected by menu.js -->
    <div class="toolbar-utils">
      <div class="spacer"></div>
      <span class="save-indicator">Saved</span>
      <button data-export-json title="Export JSON">Export</button>
      <button data-toggle-inspector title="Toggle AST Inspector">AST</button>
    </div>
  </div>

  <div class="editor-pane">
    <div class="editor-content">
      <!-- ProseMirror mounts here -->
    </div>
  </div>

  <div class="editor-sidebar">
    <p class="site-label" data-site-label></p>
    <component-settings></component-settings>
    <doc-browser></doc-browser>
    <theme-picker></theme-picker>
    <meta-panel></meta-panel>
  </div>

  <div class="editor-inspector">
    <ast-inspector></ast-inspector>
  </div>
</editor-shell>

<script type="module" src="assets/js/editor.js"></script>
<!-- Vanilla Breeze's own elements (the bundled components) are live in the
     editor. After editor.js: VB also ships a <theme-picker>, and its registry
     skips a tag that is already defined, so the editor's own picker wins. -->
<script type="module" src="/assets/vb/vanilla-breeze.js"></script>
</body>
</html>
