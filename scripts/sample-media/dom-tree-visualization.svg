<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="DOM tree showing document, html, head, body, and child element nodes">
  <style>
    .node { font: 600 12px ui-monospace, monospace; fill: #1a1a2e; }
    .ce { font: 600 12px ui-monospace, monospace; fill: #16a34a; }
    .pill { fill: #dbeafe; stroke: #2563eb; }
    .pill-ce { fill: #dcfce7; stroke: #16a34a; }
    .edge { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
  </style>
  <g>
    <rect class="pill" x="240" y="20" width="120" height="32" rx="16"/>
    <text class="node" x="300" y="40" text-anchor="middle">#document</text>
  </g>
  <line class="edge" x1="300" y1="52" x2="300" y2="80"/>
  <g>
    <rect class="pill" x="260" y="80" width="80" height="32" rx="16"/>
    <text class="node" x="300" y="100" text-anchor="middle">&lt;html&gt;</text>
  </g>
  <line class="edge" x1="300" y1="112" x2="180" y2="140"/>
  <line class="edge" x1="300" y1="112" x2="420" y2="140"/>
  <g>
    <rect class="pill" x="140" y="140" width="80" height="32" rx="16"/>
    <text class="node" x="180" y="160" text-anchor="middle">&lt;head&gt;</text>
  </g>
  <g>
    <rect class="pill" x="380" y="140" width="80" height="32" rx="16"/>
    <text class="node" x="420" y="160" text-anchor="middle">&lt;body&gt;</text>
  </g>
  <line class="edge" x1="180" y1="172" x2="120" y2="200"/>
  <line class="edge" x1="180" y1="172" x2="240" y2="200"/>
  <g>
    <rect class="pill" x="80" y="200" width="80" height="32" rx="16"/>
    <text class="node" x="120" y="220" text-anchor="middle">&lt;title&gt;</text>
  </g>
  <g>
    <rect class="pill" x="200" y="200" width="80" height="32" rx="16"/>
    <text class="node" x="240" y="220" text-anchor="middle">&lt;meta&gt;</text>
  </g>
  <line class="edge" x1="420" y1="172" x2="340" y2="200"/>
  <line class="edge" x1="420" y1="172" x2="500" y2="200"/>
  <g>
    <rect class="pill" x="300" y="200" width="80" height="32" rx="16"/>
    <text class="node" x="340" y="220" text-anchor="middle">&lt;header&gt;</text>
  </g>
  <g>
    <rect class="pill" x="460" y="200" width="80" height="32" rx="16"/>
    <text class="node" x="500" y="220" text-anchor="middle">&lt;main&gt;</text>
  </g>
  <line class="edge" x1="500" y1="232" x2="440" y2="260"/>
  <line class="edge" x1="500" y1="232" x2="560" y2="260"/>
  <g>
    <rect class="pill-ce" x="380" y="260" width="120" height="32" rx="16"/>
    <text class="ce" x="440" y="280" text-anchor="middle">&lt;tab-set&gt;</text>
  </g>
  <g>
    <rect class="pill-ce" x="510" y="260" width="120" height="32" rx="16"/>
    <text class="ce" x="570" y="280" text-anchor="middle">&lt;status-message&gt;</text>
  </g>
  <text class="node" x="300" y="330" text-anchor="middle" fill="#16a34a">green = custom elements</text>
  <text class="node" x="300" y="350" text-anchor="middle" fill="#555">document.querySelectorAll('*') walks every node</text>
</svg>
