<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Layout · Vanilla Press</title>
<link rel="icon" href="/brand/favicon.ico" sizes="any"/>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/brand/png/apple-touch-icon.png"/>
<link rel="manifest" href="/brand/site.webmanifest"/>
<meta name="theme-color" content="#23314F"/>
<link rel="stylesheet" href="/assets/vb/vanilla-breeze.css"/>
<link rel="stylesheet" href="/brand/tokens.css"/>
<link rel="stylesheet" href="/app/assets/brand-ui.css"/>
<link rel="stylesheet" href="assets/css/editor.css"/>

<script type="importmap">
{
  "imports": {
    "prosemirror-model": "https://esm.sh/*prosemirror-model@1.25.1",
    "prosemirror-state": "https://esm.sh/*prosemirror-state@1.4.3",
    "prosemirror-view": "https://esm.sh/*prosemirror-view@1.38.1",
    "prosemirror-transform": "https://esm.sh/*prosemirror-transform@1.10.4",
    "prosemirror-keymap": "https://esm.sh/*prosemirror-keymap@1.2.2",
    "prosemirror-commands": "https://esm.sh/*prosemirror-commands@1.6.2",
    "prosemirror-history": "https://esm.sh/*prosemirror-history@1.4.1",
    "prosemirror-inputrules": "https://esm.sh/*prosemirror-inputrules@1.4.0",
    "prosemirror-schema-list": "https://esm.sh/*prosemirror-schema-list@1.5.1",
    "prosemirror-dropcursor": "https://esm.sh/*prosemirror-dropcursor@1.8.1",
    "prosemirror-gapcursor": "https://esm.sh/*prosemirror-gapcursor@1.3.2",
    "prosemirror-tables": "https://esm.sh/*prosemirror-tables@1.6.2",
    "rope-sequence": "https://esm.sh/*rope-sequence@1.3.4",
    "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8",
    "orderedmap": "https://esm.sh/*orderedmap@2.1.1",
    "crelt": "https://esm.sh/*crelt@1.0.6"
  }
}
</script>
</head>
<body>
<div class="le-page" data-layout-editor-page>
  <!-- The bar: back to Layouts, the layout's name, its info and Save. Wired by layout-editor/main.js -->
  <header class="le-bar on-ink">
    <a class="le-back" data-le-back href="/app/">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"></path></svg>
      Layouts
    </a>
    <p class="le-file" data-le-file></p>
    <div class="le-fields" data-le-info-fields hidden>
      <label class="le-field-input">Label <input type="text" data-le-label/></label>
      <label class="le-field-input le-description">Description <input type="text" data-le-description/></label>
      <label class="le-field-input">Page structure <select data-le-page-layout></select></label>
      <label class="le-check" data-le-abstract-field hidden><input type="checkbox" data-le-abstract/> Abstract</label>
    </div>
    <div class="le-actions">
      <button type="button" class="quiet" data-le-add>Add block</button>
      <!-- Head items (a base only): layout-editor/head-dialog.js -->
      <button type="button" data-le-head disabled hidden>Head</button>
      <button type="button" class="primary" data-le-save>Save</button>
    </div>
    <div class="le-status" data-le-status role="status" aria-live="polite"></div>
  </header>

  <!-- Three panes: canvas, inspector, preview -->
  <main class="le-panes">
    <div class="le-canvas" data-le-canvas aria-label="Layout blocks" data-vb-no-track></div>
    <!-- The inspector (the selected block's settings) mounts here: Task 9 -->
    <aside class="le-inspector" data-le-inspector aria-label="Block settings"></aside>
    <!-- The preview (document, Desktop / Narrow, sandboxed iframe): layout-editor/preview-pane.js -->
    <section class="le-preview" data-le-preview aria-label="Preview"></section>
  </main>
  <confirm-panel data-confirm></confirm-panel>
</div>

<script type="module" src="assets/js/layout-editor/main.js"></script>
<script type="module" src="/assets/vb/vanilla-breeze.js"></script>
</body>
</html>
