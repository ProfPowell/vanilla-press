<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Site - Vanilla Press</title>
<link rel="stylesheet" href="/assets/vb/vanilla-breeze.css"/>
<link rel="stylesheet" href="/app/assets/app.css"/>
<!-- The editor's theme picker first: VB also ships a <theme-picker>, and its registry skips a tag already defined. -->
<script type="module" src="/editor/assets/js/components/theme-picker.js"></script>
<script type="module" src="/assets/vb/vanilla-breeze.js"></script>
<script type="module" src="/app/assets/js/site-page.js"></script>
</head>
<body>
<div class="site-shell">
  <nav aria-label="Site" class="site-rail">
    <a href="/" class="rail-back"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"></path></svg>All sites</a>
    <div class="rail-site">
      <p id="site-name" class="rail-name">Site</p>
      <a id="view-site" class="rail-live" href="#" target="_blank" rel="noopener" hidden>View live site <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg></a>
    </div>
    <ul id="rail-sections" class="rail-list">
      <li><a href="#" data-section="posts">Posts</a></li>
      <li><a href="#" data-section="media">Media</a></li>
      <li><a href="#" data-section="components">Components</a></li>
      <li><a href="#" data-section="theme">Theme</a></li>
    </ul>
    <ul id="rail-later" class="rail-list rail-later" aria-label="Coming later"></ul>
    <div id="rail-status" class="rail-status" role="status">
      <span class="sync" id="rail-sync" data-tone="off"><span class="dot" aria-hidden="true"></span><span id="rail-sync-text">Checking GitHub</span></span>
      <span id="backup-status"></span>
    </div>
  </nav>

  <main class="site-main">
    <div class="site-main-inner">
      <p id="error" class="error" role="alert" hidden></p>

      <section id="posts-section" aria-labelledby="posts-title">
        <div class="section-head">
          <h1 id="posts-title">Posts</h1>
          <div class="actions">
            <button type="button" id="preview-btn">Preview site</button>
            <button type="button" id="new-post" class="primary"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>New post</button>
          </div>
        </div>
        <p id="preview-error" class="error" role="alert" hidden></p>
        <div class="posts-bar">
          <div id="post-filters" role="group" aria-label="Filter posts" class="filter-group">
            <button type="button" data-filter="all" aria-pressed="true">All <span class="count"></span></button>
            <button type="button" data-filter="published" aria-pressed="false">Published <span class="count"></span></button>
            <button type="button" data-filter="drafts" aria-pressed="false">Drafts <span class="count"></span></button>
          </div>
          <label class="search"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span class="visually-hidden">Search posts</span><input type="search" id="post-search" placeholder="Search posts" autocomplete="off"/></label>
        </div>
        <ul id="posts" class="post-list" aria-labelledby="posts-title"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>

      <section id="media-section" aria-labelledby="media-title" hidden>
        <div class="section-head"><h1 id="media-title">Media</h1></div>
        <p class="lede">Coming in the next step</p>
      </section>

      <section id="components-section" aria-labelledby="components-title" hidden>
        <div class="section-head"><h1 id="components-title">Components</h1></div>
        <p id="components-notice" class="notice" role="status" hidden></p>
        <div id="components-error" class="error" role="alert" hidden></div>
        <ul id="components" class="component-list" aria-labelledby="components-title"></ul>
      </section>

      <section id="theme-section" aria-labelledby="theme-title" hidden>
        <div class="section-head"><h1 id="theme-title">Theme</h1></div>
        <p class="lede">The look of every page on the site.</p>
        <div class="panel theme-panel"><theme-picker id="theme-picker"></theme-picker></div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
