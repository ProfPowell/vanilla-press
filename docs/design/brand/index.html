<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanilla Press brand assets</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #23314F; background: #F4EDE0; }
  body { margin: 0; padding: 2rem; display: grid; gap: 2rem; }
  h1 { font-family: Charter, Georgia, serif; margin: 0; }
  h2 { font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: #5A3A24; margin: 0 0 .75rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
  figure { margin: 0; padding: 1rem; border-radius: 12px; background: #FFFAF0; border: 1px solid #E2D6BD; display: grid; gap: .5rem; justify-items: center; }
  figure.dark { background: #23314F; color: #F7EEDB; border-color: #23314F; }
  figcaption { font: 12px/1.3 ui-monospace, Menlo, monospace; }
  img { display: block; }
</style>
</head>
<body>
  <h1>Vanilla Press · Bloom Seal 04</h1>
  <section>
    <h2>Marks</h2>
    <div class="row">
      <figure><img src="svg/seal-ink.svg" width="160" height="160" alt="Ink seal"><figcaption>seal-ink.svg</figcaption></figure>
      <figure><img src="svg/seal-ink-medium.svg" width="64" height="64" alt="Ink seal, medium"><figcaption>seal-ink-medium.svg</figcaption></figure>
      <figure><img src="svg/seal-ink-micro.svg" width="24" height="24" alt="Ink seal, micro"><figcaption>seal-ink-micro.svg</figcaption></figure>
      <figure class="dark"><img src="svg/seal-vanilla.svg" width="160" height="160" alt="Vanilla seal"><figcaption>seal-vanilla.svg</figcaption></figure>
      <figure class="dark"><img src="svg/seal-vanilla-medium.svg" width="64" height="64" alt="Vanilla seal, medium"><figcaption>seal-vanilla-medium.svg</figcaption></figure>
      <figure class="dark"><img src="svg/seal-vanilla-micro.svg" width="24" height="24" alt="Vanilla seal, micro"><figcaption>seal-vanilla-micro.svg</figcaption></figure>
      <figure><img src="svg/seal-mono.svg" width="96" height="96" alt="One-color seal"><figcaption>seal-mono.svg</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>Lockups</h2>
    <div class="row">
      <figure><img src="svg/lockup-horizontal-ink.svg" height="72" alt="Vanilla Press"><figcaption>lockup-horizontal-ink.svg</figcaption></figure>
      <figure class="dark"><img src="svg/lockup-horizontal-vanilla.svg" height="72" alt="Vanilla Press"><figcaption>lockup-horizontal-vanilla.svg</figcaption></figure>
      <figure><img src="svg/lockup-stacked-ink.svg" height="110" alt="Vanilla Press"><figcaption>lockup-stacked-ink.svg</figcaption></figure>
      <figure class="dark"><img src="svg/lockup-stacked-vanilla.svg" height="110" alt="Vanilla Press"><figcaption>lockup-stacked-vanilla.svg</figcaption></figure>
      <figure><img src="svg/wordmark-ink.svg" height="40" alt="Vanilla Press"><figcaption>wordmark-ink.svg</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>Icons and favicons</h2>
    <div class="row">
      <figure><img src="png/icon-512.png" width="128" height="128" alt=""><figcaption>icon-512.png</figcaption></figure>
      <figure><img src="png/icon-maskable-512.png" width="128" height="128" alt=""><figcaption>icon-maskable-512.png</figcaption></figure>
      <figure><img src="png/icon-dark-512.png" width="128" height="128" alt=""><figcaption>icon-dark-512.png</figcaption></figure>
      <figure><img src="png/apple-touch-icon.png" width="90" height="90" alt=""><figcaption>apple-touch-icon.png</figcaption></figure>
      <figure><img src="png/favicon-48.png" width="48" height="48" alt=""><figcaption>favicon-48.png</figcaption></figure>
      <figure><img src="png/favicon-32.png" width="32" height="32" alt=""><figcaption>favicon-32.png</figcaption></figure>
      <figure><img src="png/favicon-16.png" width="16" height="16" alt=""><figcaption>favicon-16.png</figcaption></figure>
      <figure><img src="favicon.svg" width="32" height="32" alt=""><figcaption>favicon.svg</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>Social</h2>
    <figure><img src="png/og-image.png" width="600" height="315" alt="Vanilla Press social card"><figcaption>og-image.png (1200×630)</figcaption></figure>
  </section>
</body>
</html>
