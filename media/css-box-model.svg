<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="CSS box model diagram">
  <style>
    .label { font: 600 13px system-ui, sans-serif; fill: #1a1a2e; }
    .sublabel { font: 500 11px ui-monospace, monospace; fill: #555; }
  </style>
  <rect x="20" y="20" width="440" height="280" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="label" x="40" y="42">margin</text>
  <rect x="60" y="60" width="360" height="200" fill="#fce7f3" stroke="#be185d" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="label" x="80" y="82">border</text>
  <rect x="100" y="100" width="280" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="120" y="122">padding</text>
  <rect x="140" y="140" width="200" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="label" x="200" y="166" text-anchor="middle">content</text>
  <text class="sublabel" x="240" y="290" text-anchor="middle">box-sizing: content-box</text>
</svg>
