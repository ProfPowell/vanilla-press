<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" role="img" aria-label="Browser rendering pipeline: Parse HTML, Build DOM, Compute Styles, Layout, Paint, Composite">
  <style>
    .name { font: 600 12px system-ui, sans-serif; fill: #1a1a2e; }
    .stage { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 6; ry: 6; }
    .arrow { fill: none; stroke: #1a1a2e; stroke-width: 2; marker-end: url(#a); }
    .legend { font: 500 10px ui-monospace, monospace; fill: #555; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <text class="legend" x="20" y="22">input</text>
  <g transform="translate(20,40)">
    <rect class="stage" width="100" height="50"/>
    <text class="name" x="50" y="22" text-anchor="middle">Parse</text>
    <text class="name" x="50" y="38" text-anchor="middle">HTML</text>
  </g>
  <line class="arrow" x1="125" y1="65" x2="155" y2="65"/>
  <g transform="translate(160,40)">
    <rect class="stage" width="100" height="50"/>
    <text class="name" x="50" y="22" text-anchor="middle">Build</text>
    <text class="name" x="50" y="38" text-anchor="middle">DOM</text>
  </g>
  <line class="arrow" x1="265" y1="65" x2="295" y2="65"/>
  <g transform="translate(300,40)">
    <rect class="stage" width="100" height="50" fill="#dcfce7" stroke="#16a34a"/>
    <text class="name" x="50" y="22" text-anchor="middle">Compute</text>
    <text class="name" x="50" y="38" text-anchor="middle">Styles</text>
  </g>
  <line class="arrow" x1="405" y1="65" x2="435" y2="65"/>
  <g transform="translate(440,40)">
    <rect class="stage" width="80" height="50" fill="#fef3c7" stroke="#ca8a04"/>
    <text class="name" x="40" y="32" text-anchor="middle">Layout</text>
  </g>
  <line class="arrow" x1="525" y1="65" x2="555" y2="65"/>
  <g transform="translate(560,40)">
    <rect class="stage" width="80" height="50" fill="#fed7aa" stroke="#ea580c"/>
    <text class="name" x="40" y="32" text-anchor="middle">Paint</text>
  </g>
  <line class="arrow" x1="645" y1="65" x2="675" y2="65"/>
  <g transform="translate(680,40)">
    <rect class="stage" width="60" height="50" fill="#fee2e2" stroke="#dc2626"/>
    <text class="name" x="30" y="32" text-anchor="middle">Composite</text>
  </g>
  <text class="legend" x="710" y="22" text-anchor="end">pixels on screen</text>
  <text class="legend" x="380" y="120" text-anchor="middle">each stage can be a performance bottleneck</text>
</svg>
