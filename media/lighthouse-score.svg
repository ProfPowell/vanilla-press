<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Lighthouse audit showing 100 across Performance, Accessibility, Best Practices, and SEO">
  <style>
    .label { font: 600 12px system-ui, sans-serif; fill: #1a1a2e; }
    .score { font: 700 28px system-ui, sans-serif; fill: #16a34a; }
    .ring-bg { fill: none; stroke: #dcfce7; stroke-width: 8; }
    .ring-fg { fill: none; stroke: #16a34a; stroke-width: 8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }
  </style>
  <g transform="translate(0,30)">
    <g transform="translate(60,0)">
      <circle class="ring-bg" cx="40" cy="40" r="32"/>
      <circle class="ring-fg" cx="40" cy="40" r="32" stroke-dasharray="201 201"/>
      <text class="score" x="40" y="50" text-anchor="middle">100</text>
      <text class="label" x="40" y="100" text-anchor="middle">Performance</text>
    </g>
    <g transform="translate(180,0)">
      <circle class="ring-bg" cx="40" cy="40" r="32"/>
      <circle class="ring-fg" cx="40" cy="40" r="32" stroke-dasharray="201 201"/>
      <text class="score" x="40" y="50" text-anchor="middle">100</text>
      <text class="label" x="40" y="100" text-anchor="middle">Accessibility</text>
    </g>
    <g transform="translate(300,0)">
      <circle class="ring-bg" cx="40" cy="40" r="32"/>
      <circle class="ring-fg" cx="40" cy="40" r="32" stroke-dasharray="201 201"/>
      <text class="score" x="40" y="50" text-anchor="middle">100</text>
      <text class="label" x="40" y="100" text-anchor="middle">Best Practices</text>
    </g>
    <g transform="translate(420,0)">
      <circle class="ring-bg" cx="40" cy="40" r="32"/>
      <circle class="ring-fg" cx="40" cy="40" r="32" stroke-dasharray="201 201"/>
      <text class="score" x="40" y="50" text-anchor="middle">100</text>
      <text class="label" x="40" y="100" text-anchor="middle">SEO</text>
    </g>
  </g>
</svg>
