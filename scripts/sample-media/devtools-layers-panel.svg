<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Mock Chrome DevTools Layers panel with composited layers highlighted">
  <style>
    .chrome { fill: #f3f4f6; stroke: #cbd5e1; }
    .tabbar { fill: #ffffff; stroke: #cbd5e1; }
    .activetab { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
    .layer { stroke: #2563eb; fill: rgba(37, 99, 235, 0.1); stroke-width: 1.5; }
    .layer-active { stroke: #16a34a; fill: rgba(22, 163, 74, 0.18); stroke-width: 2; }
    .label { font: 600 11px ui-monospace, monospace; fill: #1a1a2e; }
    .tab { font: 500 11px system-ui, sans-serif; fill: #555; }
    .title { font: 600 12px system-ui, sans-serif; fill: #1a1a2e; }
  </style>
  <rect class="chrome" x="2" y="2" width="716" height="416" rx="8"/>
  <circle cx="22" cy="20" r="6" fill="#ef4444"/>
  <circle cx="40" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="20" r="6" fill="#22c55e"/>
  <text class="title" x="80" y="24">DevTools — Layers</text>
  <rect class="tabbar" x="2" y="42" width="716" height="32"/>
  <text class="tab" x="20" y="62">Elements</text>
  <text class="tab" x="80" y="62">Console</text>
  <text class="tab" x="140" y="62">Network</text>
  <rect class="activetab" x="190" y="46" width="60" height="24" rx="4"/>
  <text class="tab" x="220" y="62" text-anchor="middle">Layers</text>
  <text class="tab" x="270" y="62">Performance</text>
  <text class="tab" x="356" y="62">Memory</text>
  <g transform="translate(40,100) rotate(-12)">
    <rect class="layer" width="500" height="200"/>
    <text class="label" x="10" y="-8">#document (root)</text>
  </g>
  <g transform="translate(80,140) rotate(-12)">
    <rect class="layer-active" width="380" height="120"/>
    <text class="label" x="10" y="-8" fill="#16a34a">main.contained — composited</text>
  </g>
  <g transform="translate(120,180) rotate(-12)">
    <rect class="layer" width="240" height="60"/>
    <text class="label" x="10" y="-8">article — will-change: transform</text>
  </g>
  <text class="title" x="40" y="380">5 layers, 1 composited (highlighted)</text>
</svg>
